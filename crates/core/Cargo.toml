[package]
name = "lunch-tray-core"
version = "0.1.0"
edition = "2024"
description = "Task model, sync, and MCP protocol shared by the Lunch Tray app and its Worker"
license = "MIT"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Utc::now() reads the JavaScript clock on wasm.
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[dev-dependencies]
pollster = "1"
