name: LunchTray
options:
  bundleIdPrefix: com.benthecarman
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6JWFWV65BL
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LunchTray:
    type: application
    platform: iOS
    sources: [LunchTray]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benthecarman.lunchtray
        PRODUCT_NAME: Lunch Tray
        PRODUCT_MODULE_NAME: LunchTray
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lunch Tray
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  LunchTrayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LunchTrayTests]
    dependencies:
      - target: LunchTray
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benthecarman.lunchtray.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lunch Tray.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lunch Tray"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LunchTray:
    build:
      targets:
        LunchTray: all
    test:
      targets: [LunchTrayTests]
