[package]
name = "lunch-tray"
version = "0.1.0"
edition = "2024"
description = "System tray todo list that tracks GitHub and Forgejo pull requests and issues"
license = "MIT"
authors = ["Ben Carman <benthecarman@live.com>"]
repository = "https://github.com/benthecarman/lunch-tray"
homepage = "https://github.com/benthecarman/lunch-tray"
readme = "README.md"
keywords = ["tray", "todo", "github", "forgejo", "gnome"]
categories = ["gui", "development-tools"]
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0.0"
eframe = "0.36"
egui = "0.36"
egui-phosphor = "0.14"
env_logger = "0.11.11"
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
log = "0.4.34"
open = "5.4.4"
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }
zbus = "5"

[profile.release]
strip = true
lto = "thin"
